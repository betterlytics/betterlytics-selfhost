name: Version sync

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose image tag matches BETTERLYTICS_VERSION
        run: |
          env_v=$(sed -n 's/^BETTERLYTICS_VERSION=//p' base/.env.base)
          tags=$(grep -o 'ghcr.io/betterlytics/betterlytics-selfhost:[^[:space:]"]*' docker-compose.yml | cut -d: -f2 | sort -u)
          echo "compose: $tags, .env.base: $env_v"
          [ -n "$env_v" ] && [ "$tags" = "$env_v" ] || { echo "::error::docker-compose.yml image tag(s) '$tags' != BETTERLYTICS_VERSION '$env_v' in base/.env.base"; exit 1; }
