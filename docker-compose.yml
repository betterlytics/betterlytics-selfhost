x-logging: &default-logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "5"

x-betterlytics-image: &betterlytics-image ghcr.io/betterlytics/betterlytics-selfhost:vX.Y.Z

services:
  betterlytics-selfhost:
    image: *betterlytics-image
    env_file:
      - ./base/.env.base
    environment:
      - DOMAIN
      - HTTP_SCHEME
      - HTTP_PORT
      - HTTPS_PORT
      - BIND_ADDRESS
      - TRUSTED_PROXIES # optional; extra proxy IPs/CIDRs whose X-Forwarded-For Caddy trusts
      - FORCE_HTTP_SCHEME
      - SSL_EMAIL
      - ACME_CA # optional; Let's Encrypt staging for tests
      - SECRET_BASE
      - DEFAULT_LANGUAGE
      - ENABLE_EMAILS
      - MAILER_SEND_API_TOKEN
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM
      - ENABLE_GEOLOCATION
      - MAXMIND_ACCOUNT_ID
      - MAXMIND_LICENSE_KEY
      - GEOLOCATION_MODE
      - BACKGROUND_JOBS_ENABLED=${BACKGROUND_JOBS_ENABLED:-true}
      - PUSHOVER_APP_TOKEN
      - REPLAY_STORAGE
      - REPLAY_RETENTION_DAYS
      - S3_ENABLED
      - S3_BUCKET
      - S3_REGION
      - S3_ENDPOINT
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
    restart: unless-stopped
    container_name: betterlytics-selfhost
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-5566}:80"
    volumes:
      - ./base/proxy:/etc/caddy:ro
      - ./base/supervisord.conf:/etc/supervisor/conf.d/betterlytics.conf:ro
      - ./base/derive.sh:/derive.sh:ro
      - ./base/secrets-env.sh:/secrets-env.sh:ro
      - ./base/entrypoint.sh:/entrypoint.sh:ro
      - betterlytics_selfhost_caddy_data:/data # certs + ACME account (XDG_DATA_HOME)
      - betterlytics_selfhost_geoip:/app/backend/assets/geoip
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$$HTTP_SCHEME" = "https" ]; then
            curl -fsk -o /dev/null --resolve "$$DOMAIN:443:127.0.0.1" "https://$$DOMAIN/";
          else
            curl -fs -o /dev/null http://localhost/;
          fi
          && curl -fs -o /dev/null http://127.0.0.1:3001/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s # first HTTPS boot waits on ACME
      start_interval: 5s
    depends_on:
      betterlytics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - clickhouse_network
      - postgres_network
    logging: *default-logging

  # One-shot: runs migrations and role provisioning, then exits.
  # The app service starts only after this exits 0; restarting the app does not re-run it.
  betterlytics-init:
    image: *betterlytics-image
    container_name: betterlytics-init
    restart: "no"
    env_file:
      - ./base/.env.base
    environment:
      - SECRET_BASE
      - SKIP_VERSION_CHECK
      - REPLAY_STORAGE
      - REPLAY_RETENTION_DAYS # ClickHouse replay TTL is set during migration
    volumes:
      - ./base/derive.sh:/derive.sh:ro
      - ./base/secrets-env.sh:/secrets-env.sh:ro
      - ./base/init-entrypoint.sh:/init-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/init-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - clickhouse_network
      - postgres_network
    logging: *default-logging

  postgres:
    image: postgres:17.5
    container_name: betterlytics-postgres
    hostname: postgres
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint-wrapper.sh"]
    env_file:
      - ./base/.env.base
    environment:
      - SECRET_BASE
    volumes:
      - ./base/postgres-config/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./base/derive.sh:/derive.sh:ro
      - betterlytics_selfhost_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
    networks:
      - postgres_network
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    user: 101:101
    container_name: betterlytics-clickhouse
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-wrapper.sh"]
    env_file:
      - ./base/.env.base
    environment:
      - SECRET_BASE
    volumes:
      - ./base/clickhouse-config/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./base/clickhouse-config/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./base/clickhouse-config/setup/:/docker-entrypoint-initdb.d/:ro
      - ./base/derive.sh:/derive.sh:ro
      - betterlytics_selfhost_clickhouse_data:/var/lib/clickhouse/
      - betterlytics_selfhost_clickhouse_users:/etc/clickhouse-server/users.d/
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
    networks:
      - clickhouse_network
    logging: *default-logging

volumes:
  betterlytics_selfhost_postgres_data:
  betterlytics_selfhost_clickhouse_data:
  betterlytics_selfhost_clickhouse_users:
  betterlytics_selfhost_caddy_data:
  betterlytics_selfhost_geoip:

networks:
  clickhouse_network:
    name: betterlytics_clickhouse_network
  postgres_network:
    name: betterlytics_postgres_network
