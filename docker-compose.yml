x-logging: &default-logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "5"

services:
  betterlytics-selfhost:
    image: ghcr.io/betterlytics/betterlytics-selfhost:latest
    env_file:
      - ./base/.env.base
    environment:
      - DOMAIN
      - HTTP_SCHEME
      - HTTP_PORT
      - HTTPS_PORT
      - BIND_ADDRESS
      - FORCE_HTTP_SCHEME
      - SSL_EMAIL
      - SECRET_BASE
      - ADMIN_EMAIL
      - ADMIN_PASSWORD
      - DEFAULT_LANGUAGE
      - ENABLE_UPTIME_MONITORING
      - ENABLE_EMAILS
      - MAILER_SEND_API_TOKEN
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM
      - ENABLE_GEOLOCATION
      - MAXMIND_ACCOUNT_ID
      - MAXMIND_LICENSE_KEY
      - SESSION_REPLAYS_ENABLED
      - S3_ENABLED
      - S3_BUCKET
      - S3_REGION
      - S3_ENDPOINT
      - S3_INTERNAL_ENDPOINT
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
      - S3_SSE_ENABLED
      - REPLAY_S3_ACCESS_KEY
      - REPLAY_S3_SECRET_KEY
      - ENABLE_DASHBOARD_TRACKING
    restart: unless-stopped
    container_name: betterlytics-selfhost
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-5566}:80"
    volumes:
      - ./base/proxy:/etc/nginx/templates:ro
      - ./base/supervisord.conf:/etc/supervisor/conf.d/betterlytics.conf:ro
      - ./base/derive.sh:/derive.sh:ro
      - ./base/entrypoint.sh:/entrypoint.sh:ro
      - betterlytics_selfhost_letsencrypt_certs:/etc/letsencrypt
      - betterlytics_selfhost_certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - clickhouse_network
      - postgres_network
      - garage_network
    logging: *default-logging

  postgres:
    image: postgres:17.5
    container_name: betterlytics-postgres
    hostname: postgres
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint-wrapper.sh"]
    env_file:
      - ./base/.env.base
    environment:
      - SECRET_BASE
    volumes:
      - ./base/postgres-config/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./base/derive.sh:/derive.sh:ro
      - betterlytics_selfhost_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
    networks:
      - postgres_network
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    user: 101:101
    container_name: betterlytics-clickhouse
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-wrapper.sh"]
    env_file:
      - ./base/.env.base
    environment:
      - SECRET_BASE
    volumes:
      - ./base/clickhouse-config/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./base/clickhouse-config/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./base/clickhouse-config/setup/:/docker-entrypoint-initdb.d/:ro
      - ./base/derive.sh:/derive.sh:ro
      - betterlytics_selfhost_clickhouse_data:/var/lib/clickhouse/
      - betterlytics_selfhost_clickhouse_users:/etc/clickhouse-server/users.d/
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
    networks:
      - clickhouse_network
    logging: *default-logging

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: betterlytics-garage
    hostname: garage
    profiles: ["replay"]
    restart: unless-stopped
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_RPC_SECRET
      - GARAGE_DEFAULT_ACCESS_KEY=${REPLAY_S3_ACCESS_KEY:-}
      - GARAGE_DEFAULT_SECRET_KEY=${REPLAY_S3_SECRET_KEY:-}
      - GARAGE_DEFAULT_BUCKET=replay-storage
    volumes:
      - ./base/garage-config/garage.toml:/etc/garage.toml:ro
      - betterlytics_selfhost_garage_data:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - garage_network
    logging: *default-logging

  garage-init:
    image: amazon/aws-cli:2.36.20
    container_name: betterlytics-garage-init
    profiles: ["replay"]
    restart: "no"
    entrypoint: ["/bin/sh", "/init.sh"]
    env_file:
      - ./base/.env.base
    environment:
      - REPLAY_S3_ACCESS_KEY
      - REPLAY_S3_SECRET_KEY
      - REPLAY_RETENTION_DAYS
    volumes:
      - ./base/garage-config/init.sh:/init.sh:ro
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - garage_network
    logging: *default-logging

volumes:
  betterlytics_selfhost_postgres_data:
  betterlytics_selfhost_clickhouse_data:
  betterlytics_selfhost_clickhouse_users:
  betterlytics_selfhost_letsencrypt_certs:
  betterlytics_selfhost_certbot_www:
  betterlytics_selfhost_garage_data:

networks:
  clickhouse_network:
    name: betterlytics_clickhouse_network
  postgres_network:
    name: betterlytics_postgres_network
  garage_network:
    name: betterlytics_garage_network
