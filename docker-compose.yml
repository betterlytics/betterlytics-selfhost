x-logging: &default-logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "5"

x-betterlytics-image: &betterlytics-image ghcr.io/betterlytics/betterlytics-selfhost:vX.Y.Z

services:
  betterlytics-selfhost:
    image: *betterlytics-image
    env_file:
      - ./base/.env.base
    environment:
      - PUBLIC_URL
      - TLS
      - HTTP_PORT # read by the TLS=auto start-up check
      - DOMAIN # retired; only for the upgrade message
      - HTTP_SCHEME # retired; only for the upgrade message
      - FORCE_HTTP_SCHEME # retired; only for the upgrade message
      - SKIP_VERSION_CHECK
      - TRUSTED_PROXIES # optional; extra proxy IPs/CIDRs whose X-Forwarded-For Caddy trusts
      - AUTH_TRUSTED_PROXIES # optional; behind your own proxy, its IPs/CIDRs so sign-in rate limits apply per visitor
      - SSL_EMAIL
      - ACME_CA # optional; Let's Encrypt staging for tests
      - SECRET_BASE
      - ENABLE_EMAILS
      - MAILER_SEND_API_TOKEN
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM
      - ENABLE_GEOLOCATION
      - ENABLE_ASN_LOOKUP # optional; bot detection via MaxMind GeoLite2-ASN, needs the MAXMIND_* credentials
      - MAXMIND_ACCOUNT_ID
      - MAXMIND_LICENSE_KEY
      - GEOLOCATION_MODE
      - PUBLIC_ENABLE_FAVICON_FETCHING # optional; false stops server-side icon fetches from DuckDuckGo
      - BACKGROUND_JOBS_ENABLED
      - LOG_LEVEL
      - PUSHOVER_APP_TOKEN
      - SESSION_REPLAYS_ENABLED
      - REPLAY_STORAGE
      - REPLAY_RETENTION_DAYS
      - DATA_RETENTION_DAYS # retired; only for the boot warning
      - S3_ENABLED
      - S3_BUCKET
      - S3_REGION
      - S3_ENDPOINT
      - S3_ACCESS_KEY_ID
      - S3_SECRET_ACCESS_KEY
      - S3_FORCE_PATH_STYLE
      - S3_SSE_ENABLED
      - ALLOW_PRIVATE_TARGETS
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    container_name: betterlytics-selfhost
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-5566}:80"
    volumes:
      - ./base/derive.sh:/derive.sh:ro
      - betterlytics_selfhost_caddy_data:/data # certs + ACME account (XDG_DATA_HOME)
      - betterlytics_selfhost_geoip:/app/backend/assets/geoip
    depends_on:
      betterlytics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - clickhouse_network
      - postgres_network
    logging: *default-logging

  # One-shot: runs migrations and role provisioning, then exits.
  # The app service starts only after this exits 0; restarting the app does not re-run it.
  betterlytics-init:
    image: *betterlytics-image
    container_name: betterlytics-init
    restart: "no"
    command: ["init"]
    healthcheck:
      disable: true # the image healthcheck probes the running app
    env_file:
      - ./base/.env.base
    environment:
      - SECRET_BASE
      - SKIP_VERSION_CHECK
      - PUBLIC_URL # checked here too, so a bad address stops before migrations
      - TLS
      - HTTP_PORT
      - DOMAIN # retired; only for the upgrade message
      - HTTP_SCHEME # retired; only for the upgrade message
      - FORCE_HTTP_SCHEME # retired; only for the upgrade message
      - REPLAY_STORAGE
      - REPLAY_RETENTION_DAYS # ClickHouse replay TTL is set during migration
      - DATA_RETENTION_DAYS # carried over once to dashboards at the 1 year default
    volumes:
      - ./base/derive.sh:/derive.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - clickhouse_network
      - postgres_network
    logging: *default-logging

  postgres:
    image: postgres:17.5
    container_name: betterlytics-postgres
    hostname: postgres
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/entrypoint-wrapper.sh"]
    env_file:
      - ./base/.env.base
    environment:
      - SECRET_BASE
    volumes:
      - ./base/postgres-config/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./base/derive.sh:/derive.sh:ro
      - betterlytics_selfhost_postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
    networks:
      - postgres_network
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6 # exact version: a bump restarts ClickHouse on update, which is when config.xml changes apply
    user: 101:101
    container_name: betterlytics-clickhouse
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-wrapper.sh"]
    env_file:
      - ./base/.env.base
    environment:
      - SECRET_BASE
    volumes:
      - ./base/clickhouse-config/config.d/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ./base/clickhouse-config/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
      - ./base/clickhouse-config/setup/:/docker-entrypoint-initdb.d/:ro
      - ./base/derive.sh:/derive.sh:ro
      - betterlytics_selfhost_clickhouse_data:/var/lib/clickhouse/
      - betterlytics_selfhost_clickhouse_users:/etc/clickhouse-server/users.d/
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 10s
    networks:
      - clickhouse_network
    logging: *default-logging

volumes:
  betterlytics_selfhost_postgres_data:
  betterlytics_selfhost_clickhouse_data:
  betterlytics_selfhost_clickhouse_users:
  betterlytics_selfhost_caddy_data:
  betterlytics_selfhost_geoip:

networks:
  clickhouse_network:
    name: betterlytics_clickhouse_network
  postgres_network:
    name: betterlytics_postgres_network
