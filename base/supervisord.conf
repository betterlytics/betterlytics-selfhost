[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:caddy]
; CADDY_SITE, CADDY_EMAIL_DIRECTIVE, ACME_CA, XDG_DATA_HOME are inherited from the entrypoint's
; environment; supervisord passes its own environment to every child.
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=2
startretries=3
priority=30

[program:backend]
command=/app/backend/app
directory=/app/backend
environment=SERVER_PORT="3001",SERVER_HOST="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
startretries=3
priority=20

[program:dashboard]
command=node /app/dashboard/server.js
directory=/app/dashboard
environment=NODE_ENV="production",HOSTNAME="0.0.0.0",PORT="3000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=5
startretries=3
priority=20
